<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CropNex - Offline</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0e2a1b; color: #ffffff; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; text-align: center; }
    .card { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 24px; padding: 36px 24px; max-width: 420px; width: 100%; box-shadow: 0 20px 40px rgba(0,0,0,0.4); backdrop-filter: blur(10px); }
    .logo { width: 80px; height: 80px; border-radius: 50%; border: 3px solid #f59e0b; margin: 0 auto 20px; object-fit: cover; display: block; box-shadow: 0 8px 16px rgba(0,0,0,0.3); }
    h1 { font-size: 24px; font-weight: 900; margin-bottom: 8px; color: #ffffff; }
    h1 span { color: #f59e0b; }
    p { font-size: 14px; color: #a7f3d0; line-height: 1.5; margin-bottom: 24px; }
    .btn { display: inline-block; background-color: #f59e0b; color: #0f172a; font-weight: 800; font-size: 14px; padding: 12px 28px; border-radius: 9999px; text-decoration: none; border: none; cursor: pointer; transition: transform 0.15s, background-color 0.15s; }
    .btn:hover { background-color: #d97706; transform: scale(1.03); }
    .badge { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; color: #f59e0b; background: rgba(245, 158, 11, 0.15); border: 1px solid rgba(245, 158, 11, 0.3); padding: 4px 12px; border-radius: 9999px; margin-bottom: 16px; }
  </style>
</head>
<body>
  <div class="card">
    <img src="/images/cropnex_logo.png" alt="CropNex" class="logo" />
    <div class="badge">📡 Offline Mode</div>
    <h1>Crop<span>Nex</span></h1>
    <p>Aapka internet connection abhi disconnected hai. Jaise hi internet wapas aayega, CropNex farm portal automatically sync ho jayega.</p>
    <button class="btn" onclick="window.location.reload()">Retry Connection</button>
  </div>
</body>
</html>
